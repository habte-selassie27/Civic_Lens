<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" role="img" aria-label="CivicLens">
  <!-- Paper badge so the mark stays legible on any tab background. -->
  <rect width="32" height="32" rx="6" fill="#EBEFEE" />
  <!-- The citation line: a sentence of a public statement being read. -->
  <line x1="3" y1="16" x2="29" y2="16" stroke="#B8C1C9" stroke-width="1" />
  <!-- The lens. -->
  <circle cx="15" cy="15" r="8" fill="none" stroke="#1B2430" stroke-width="2" />
  <!-- Handle. -->
  <line x1="20.5" y1="20.5" x2="26" y2="26" stroke="#1B2430" stroke-width="2" stroke-linecap="round" />
  <!-- Focus point: the citation accent, used for one element only. -->
  <circle cx="15" cy="15" r="2" fill="#2F5B7C" />
</svg>
