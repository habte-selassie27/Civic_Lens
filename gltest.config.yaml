networks:
  default: localnet

  localnet:
    url: "http://127.0.0.1:4000/api"

  studionet: {}

paths:
  contracts: "contracts"
  # gltest rmtree's this directory at every session start, so it MUST NOT be the
  # repo's `artifacts/` — that holds the committed screenshot evidence pack and
  # was silently wiped by an integration run. A dedicated directory keeps the
  # two apart.
  artifacts: ".gltest-artifacts"

environment: .env
